<div class="table-container mat-elevation-z2">
  <table mat-table [dataSource]="dataSource" matSort class="mat-table">

    <!-- Data -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Data</th>
      <td mat-cell *matCellDef="let element">{{ element.date ? (element.date | date) : 'Data inválida' }}</td>
    </ng-container>

    <!-- Rota (IATA) -->
    <ng-container matColumnDef="iatapair">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Rota (IATA)</th>
      <td mat-cell *matCellDef="let element">{{ element.iatapair ? element.iatapair.slice(0, 3) : 'N/A' }} → {{ element.iatapair ? element.iatapair.slice(3, 6) : 'N/A' }}</td>
    </ng-container>

    <!-- Partidas -->
    <ng-container matColumnDef="departures">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Partidas</th>
      <td mat-cell *matCellDef="let element">{{ element.departures }}</td>
    </ng-container>

    <!-- Chegadas -->
    <ng-container matColumnDef="arrivals">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Chegadas</th>
      <td mat-cell *matCellDef="let element">{{ element.arrivals }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
