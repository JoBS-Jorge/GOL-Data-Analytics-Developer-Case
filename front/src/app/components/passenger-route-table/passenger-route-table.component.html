<div class="table-container mat-elevation-z2">
  <table mat-table [dataSource]="dataSource" class="mat-table">

    <!-- Data -->
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Data</th>
      <td mat-cell *matCellDef="let element">{{ element.date | date }}</td>
    </ng-container>

    <!-- Rota (IATA) -->
    <ng-container matColumnDef="iatapair">
      <th mat-header-cell *matHeaderCellDef>Rota (IATA)</th>
      <td mat-cell *matCellDef="let element">{{ element.iatapair.slice(0, 3) }} → {{ element.iatapair.slice(3, 6) }}</td>
    </ng-container>

    <!-- Partidas -->
    <ng-container matColumnDef="departures">
      <th mat-header-cell *matHeaderCellDef>Partidas</th>
      <td mat-cell *matCellDef="let element">{{ element.departures }}</td>
    </ng-container>

    <!-- Chegadas -->
    <ng-container matColumnDef="arrivals">
      <th mat-header-cell *matHeaderCellDef>Chegadas</th>
      <td mat-cell *matCellDef="let element">{{ element.arrivals }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
